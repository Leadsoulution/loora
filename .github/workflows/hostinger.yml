# À chaque envoi sur main : construit le site (dossier out/) et le publie sur la branche « hostinger »,
# que Hostinger déploie dans public_html.
# Toutes les 6 heures : reconstruit avec le contenu modifié dans le dashboard, pour que les pages
# HTML générées restent à jour (aucune publication si rien n'a changé).
name: Publier pour Hostinger

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publier out/ sur la branche hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./out
          enable_jekyll: true
          commit_message: "Site construit depuis"
